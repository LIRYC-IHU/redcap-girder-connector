; e2e overrides (loaded after redcap-overrides.ini).
; The stack is served over plain http://localhost:18081.
session.cookie_secure = Off
; Surface PHP errors in the container log, never in pages.
display_errors = Off
log_errors = On
error_log = /dev/stderr
; Pick up module edits from the read-only bind mount immediately.
opcache.revalidate_freq = 0
